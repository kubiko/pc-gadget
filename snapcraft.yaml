name: pc
version: '26-0.1'
type: gadget
base: core26
summary: PC gadget for generic devices
description: |
    This gadget enables generic pc devices to work with Ubuntu Core
confinement: strict
grade: stable
icon: icon.png

hooks:
  prepare-device:
    environment:
      # If you are forking and building your own gadget:
      # define your model's API key here
      # See https://ubuntu.com/core/services/guide/serial-vault-overview
      # for instructions on how to generate an API key
      # DO NOT check this API key into a publicly accessible VCS
      MODEL_APIKEY: ""

# Min version to support shim 15.7
assumes:
  - snapd2.63

parts:
  boot-assets:
    plugin: nil
    build-packages:
      - openssl
      - ovmf-generic
      - sbsigntool
    stage-packages:
      - grub-efi-$CRAFT_ARCH_BUILD_FOR-signed
      - shim-signed
    override-build: |
      set -x

      # Set some variables that depend on the architecture
      grub_target=x86_64
      grub_bin=grubx64.efi.signed
      shim_bin=shimx64.efi.dualsigned
      fb_bin=fbx64.efi
      boot_csv=BOOTX64.CSV
      if [ "${CRAFT_ARCH_BUILD_FOR}" = arm64 ]; then
          grub_target=arm64
          grub_bin=grubaa64.efi.signed
          shim_bin=shimaa64.efi.dualsigned
          fb_bin=fbaa64.efi
          boot_csv=BOOTAA64.CSV
      fi

      # Make sure we have have the right signatures
      shim_path="${CRAFT_PART_INSTALL}"/usr/lib/shim/$shim_bin
      fb_path="${CRAFT_PART_INSTALL}/usr/lib/shim/${fb_bin}"
      bootcsv_path="${CRAFT_PART_INSTALL}/usr/lib/shim/${boot_csv}"
      grub_path="${CRAFT_PART_INSTALL}"/usr/lib/grub/"$grub_target"-efi-signed/$grub_bin
      sbverify --list "$shim_path" | grep -E 'Canonical Ltd. Secure Boot Signing \(2022 v1\)'
      sbverify --list "$grub_path" | grep -E 'Canonical Ltd. Secure Boot Signing \(2022 v1\)'

      # Move shim/grub to the expected path
      install -m 644 "$shim_path" "${CRAFT_PART_INSTALL}"/shim.efi.signed
      install -m 644 "$grub_path" "${CRAFT_PART_INSTALL}"/${grub_bin%.signed}
      install -m 644 "${fb_path}" "${CRAFT_PART_INSTALL}/fb.efi"
      install -m 644 "${bootcsv_path}" "${CRAFT_PART_INSTALL}/boot.csv"

      # Add a signature with the snakeoil key ovmf-generic ships, which its
      # OVMF_VARS_4M.snakeoil.fd enrolls as PK, KEK and db, and AAVMF_VARS.snakeoil.fd
      # of qemu-efi-aarch64 too, so that the gadget boots qemu with Secure Boot
      # enforcing. shim keeps its Microsoft signatures, and firmware accepts an
      # image any one of its signatures verifies, so nothing changes on a machine
      # that does not trust the snakeoil key. grub needs no extra signature: shim
      # verifies it against the Canonical certificate it embeds. The package
      # encrypts the key with the passphrase its README.Debian publishes, 'snakeoil'
      snakeoil_key="${CRAFT_PART_BUILD}/snakeoil.key"
      snakeoil_cert=/usr/share/ovmf/PkKek-1-snakeoil.pem
      openssl pkey -in /usr/share/ovmf/PkKek-1-snakeoil.key -passin pass:snakeoil -out "${snakeoil_key}"
      sbsign --key "${snakeoil_key}" --cert "${snakeoil_cert}" \
          --output "${CRAFT_PART_INSTALL}"/shim.efi.signed "${CRAFT_PART_INSTALL}"/shim.efi.signed
      sbverify --cert "${snakeoil_cert}" "${CRAFT_PART_INSTALL}"/shim.efi.signed

      # Remove all the bits we do not need, keeping changelogs and copyrights
      # (using organize/prime is not possible due to different names per arch - x64/aa64)
      find "${CRAFT_PART_INSTALL}"/ -type f,l \
                -not -path "${CRAFT_PART_INSTALL}"/shim.efi.signed \
                -not -path "${CRAFT_PART_INSTALL}"/${grub_bin%.signed} \
                -not -path "${CRAFT_PART_INSTALL}"/fb.efi \
                -not -path "${CRAFT_PART_INSTALL}"/boot.csv \
                -not -path "${CRAFT_PART_INSTALL}"/usr/share/doc/grub-efi-${CRAFT_ARCH_BUILD_FOR}-signed/'*' \
           -and -not -path "${CRAFT_PART_INSTALL}"/'usr/share/doc/shim-signed/*' \
           -delete
      find "${CRAFT_PART_INSTALL}"/ -type d -empty -delete

      # grub.conf lets snapd identify grub as the bootloader on boot
      install -m 644 /dev/null "${CRAFT_PART_INSTALL}"/grub.conf
  gadget:
    plugin: nil
    source: gadget
    override-build: |
      # We need to install directly in the project dir as snapcraft checks there
      # for gadget.yaml instead of looking first at the prime folder.
      install -m 644 gadget-"${CRAFT_ARCH_BUILD_FOR}".yaml "${CRAFT_PROJECT_DIR}"/gadget.yaml
      # the A/B boot logic, which gadget.yaml puts on the ESP as EFI/ubuntu/grub.cfg
      install -m 644 grub-ab.cfg "${CRAFT_PART_INSTALL}"/grub.cfg

  device-config:
    plugin: nil
    override-build: |
      mkdir -p "${CRAFT_PART_INSTALL}/device-config"
