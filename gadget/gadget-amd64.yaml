# The Ubuntu Core mini A/B layout, booted by grub on UEFI.
#
# The same schema as the U-Boot reference gadget (imx-gadget, the *-lite
# branches): two system slots and two apps slots, each a raw partition holding a
# nested GPT with one partition per snap and a trailing snap-meta partition. The
# apps slots are encrypted on the first boot.
#
# What differs from U-Boot is where the bootloader finds the kernel. grub cannot
# read a snap inside a slot's nested GPT, so each slot's kernel.efi is extracted
# to ubuntu-seed, which is the ESP, as EFI/ubuntu/slot-<a|b>/kernel.efi. The
# grub environment is EFI/ubuntu/grubenv on ubuntu-boot (ext4) rather than on
# the ESP, for the journal. ubuntu-seed holds no recovery systems: the other
# slot is the fallback, and the seed carries only what the first boot needs.
#
# UEFI only, so there is no BIOS Boot partition and no MBR boot code.
volumes:
  pc:
    schema: gpt
    bootloader: grub
    structure:
      - name: ubuntu-seed
        role: system-seed
        filesystem: vfat
        # UEFI will boot the ESP partition by default first
        type: C12A7328-F81F-11D2-BA4B-00A0C93EC93B
        # shim and grub, two kernel.efi of about 18M each, and the first boot's
        # preseed data
        size: 256M
        content:
          - source: grubx64.efi
            target: EFI/ubuntu/grubx64.efi
          - source: shim.efi.signed
            target: EFI/ubuntu/shimx64.efi
          - source: boot.csv
            target: EFI/ubuntu/bootx64.csv
          - source: grub.cfg
            target: EFI/ubuntu/grub.cfg
          - source: fb.efi
            target: EFI/boot/fbx64.efi
          - source: shim.efi.signed
            target: EFI/boot/bootx64.efi
      - name: ubuntu-system-a
        type: 20117F86-E985-4357-B9EE-374BC1D8487D
        # the kernel snap alone is about 210M, the base, snapd and the gadget
        # about 130M together, and a refresh may grow any of them
        size: 1G
      - name: ubuntu-system-b
        type: 20117F86-E985-4357-B9EE-374BC1D8487D
        size: 1G
      - name: ubuntu-apps-a
        type: 20117F86-E985-4357-B9EE-374BC1D8487D
        size: 512M
      - name: ubuntu-apps-b
        type: 20117F86-E985-4357-B9EE-374BC1D8487D
        size: 512M
      - name: ubuntu-boot
        role: system-boot
        filesystem: ext4
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        # the grub environment only, the kernels are on ubuntu-seed
        size: 16M
      - name: ubuntu-save
        role: system-save
        filesystem: ext4
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        size: 32M
      - name: ubuntu-data
        role: system-data
        filesystem: ext4
        type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        size: 1G
