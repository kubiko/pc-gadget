# grub.cfg for the Ubuntu Core mini A/B layout
#
# The ESP is ubuntu-seed. It holds shim, grub, this file, and one kernel.efi per
# system slot, which snapd extracts from the slot's kernel snap when it writes
# the slot: grub cannot read a snap inside a slot's nested GPT the way U-Boot
# does. The state this reads and writes is in EFI/ubuntu/grubenv on ubuntu-boot,
# an ext4 filesystem, so that snapd's writes to it go through the journal.
#
#   snapd_recovery_mode        install on the first boot, run after it
#   active_slot                a or b, the slot that last booted successfully
#   try_slot                   a or b, the slot armed for a trial
#   slot_status                empty, try (set by snapd) or trying (set here)
#   snapd_extra_cmdline_args   appended to the static arguments below
#   snapd_full_cmdline_args    replaces them
#   snapd_try_cmdline_args     replaces them for the boot of a trial slot only
#   development_boot           1 lets the initrd map unasserted snaps
#
# The kernel command line ends with 'dangerous' on a development boot and with
# 'panic=-1' otherwise, as U-Boot's fixup_secure_linux() does: the initrd maps a
# snap from a recorded, unasserted root hash only when 'dangerous' is the last
# word and 'panic=-1' is absent. Nothing here is verified, unlike U-Boot's FIT;
# what makes the word safe is that systemd-stub measures the whole command line
# into PCR 12, and snapd seals disk keys only to the command line it composed.
# A development boot of a sealed production device boots, and unseals nothing.

set default=0
set timeout=0
set timeout_style=hidden

set snapd_static_cmdline_args='console=ttyS0 console=tty1'
# the serial line of an arm64 machine with a PL011, as qemu's virt machine has
if [ "${grub_cpu}" = "arm64" ]; then
  set snapd_static_cmdline_args='console=ttyAMA0 console=tty1'
fi

# ubuntu-boot on the disk grub started from, preferred over any other disk
regexp --set 1:esp_disk '^\(([^,]+),' "${cmdpath}"
search --no-floppy --set=boot_fs --label ubuntu-boot --hint "${esp_disk},"
if [ -n "${boot_fs}" ]; then
  set env_file="(${boot_fs})/EFI/ubuntu/grubenv"
  if [ -s "${env_file}" ]; then
    load_env --file "${env_file}" snapd_recovery_mode active_slot try_slot slot_status \
      snapd_extra_cmdline_args snapd_full_cmdline_args snapd_try_cmdline_args \
      development_boot
  fi
fi

if [ -z "${snapd_recovery_mode}" ]; then
  set snapd_recovery_mode=run
fi
if [ "${active_slot}" != "b" ]; then
  set active_slot=a
fi
set slot="${active_slot}"
set trial_boot=

# One attempt per trial. 'try' becomes 'trying' before the trial slot boots;
# snapd commits the trial from the booted system. A 'trying' found here means
# the trial never got that far, so it is dropped and the active slot boots.
# snapd then sees a trial that is no longer armed while running from the other
# slot, and undoes the refresh.
if [ -n "${env_file}" ]; then
  if [ "${slot_status}" = "try" ]; then
    if [ "${try_slot}" = "a" -o "${try_slot}" = "b" ]; then
      set slot="${try_slot}"
      set slot_status=trying
      set trial_boot=1
    else
      set slot_status=
    fi
    save_env --file "${env_file}" slot_status
  elif [ "${slot_status}" = "trying" ]; then
    set slot_status=
    save_env --file "${env_file}" slot_status
  fi
fi

# A slot may bring its own command line, with a gadget that changes it. Only
# the trial of the slot boots with it: a boot that falls back to the active
# slot runs with the arguments it always had. snapd makes them the arguments
# of the system when it commits the trial, and drops them otherwise.
if [ -n "${trial_boot}" -a -n "${snapd_try_cmdline_args}" ]; then
  set cmdline_args="${snapd_try_cmdline_args}"
elif [ -n "${snapd_full_cmdline_args}" ]; then
  set cmdline_args="${snapd_full_cmdline_args}"
else
  set cmdline_args="${snapd_static_cmdline_args} ${snapd_extra_cmdline_args}"
fi

# grub sets 'lockdown' to y when it runs under Secure Boot. Without Secure Boot
# nothing in the chain is verified, so the boot is a development one, as on a
# board whose secure boot fuse is open
if [ "${lockdown}" != "y" -o "${development_boot}" = "1" ]; then
  set boot_gate=dangerous
else
  set boot_gate=panic=-1
fi

menuentry "Ubuntu Core, slot ${slot}" {
  chainloader "/EFI/ubuntu/slot-${slot}/kernel.efi" \
    snapd_recovery_mode=${snapd_recovery_mode} uc_slot=${slot} ${cmdline_args} ${boot_gate}
}
